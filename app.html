<!doctype html>
<html lang="uk" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFT4UA Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* EFT Portal — Farben, Abstände, Radien, Größen und Schriftfamilien aus tokens.json */
:root,[data-theme="light"]{--surface:#ffffff;--surface-subtle:#f9f9f9;--surface-muted:#f2f2f2;--border:#f2f2f2;--border-control:#8a8a8a;--ink:#242424;--ink-strong:#191919;--ink-muted:#6b6b6b;--on-ink:#ffffff;--accent:#1b7a3e;--on-accent:#ffffff;--accent-soft:#e9f4ec;--warning:#8a5300;--warning-soft:#fdf2e0;--danger:#b3261e;--scrim:rgba(25,25,25,0.4);--shadow-popover:0 2px 10px rgba(0,0,0,0.15)}
[data-theme="dark"]{color-scheme:dark;--surface:#121212;--surface-subtle:#191919;--surface-muted:#262626;--border:#2a2a2a;--border-control:#7a7a7a;--ink:#e6e6e6;--ink-strong:#fafafa;--ink-muted:#a3a3a3;--on-ink:#121212;--accent:#5cc480;--on-accent:#0b1a10;--accent-soft:#16281c;--warning:#f0b44c;--warning-soft:#2a2013;--danger:#ff8a7a;--scrim:rgba(0,0,0,0.6);--shadow-popover:0 2px 12px rgba(0,0,0,0.6)}
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--space-24:96px;--radius-none:0;--radius-sm:4px;--radius-md:8px;--radius-pill:999px;--radius-full:50%;--content-width:680px;--feed-width:728px;--page-width:1192px;--sidebar-width:368px;--header-height:57px;--avatar-xs:20px;--avatar-sm:32px;--avatar-md:44px;--avatar-lg:72px;--icon-size:24px;--thumb-width:160px;--font-sans:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;--font-serif:"Charis SIL",Charter,"Bitstream Charter",Georgia,Cambria,serif;--font-mono:"JetBrains Mono",Menlo,Consolas,monospace}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#121212;--surface-subtle:#191919;--surface-muted:#262626;--border:#2a2a2a;--border-control:#7a7a7a;--ink:#e6e6e6;--ink-strong:#fafafa;--ink-muted:#a3a3a3;--on-ink:#121212;--accent:#5cc480;--on-accent:#0b1a10;--accent-soft:#16281c;--warning:#f0b44c;--warning-soft:#2a2013;--danger:#ff8a7a;--scrim:rgba(0,0,0,0.6);--shadow-popover:0 2px 12px rgba(0,0,0,0.6);color-scheme:dark}}
/* Icons: Klasse ep-icon + ep-icon--<name>; Farbe über color (currentColor). */
.ep-icon{display:inline-block;flex:none;width:var(--icon-size);height:var(--icon-size);background-color:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;vertical-align:middle}
.ep-icon--sm{width:20px;height:20px}
.ep-icon--heart{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z%22/%3E%3C/svg%3E")}
.ep-icon--comment{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z%22/%3E%3C/svg%3E")}
.ep-icon--bookmark{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z%22/%3E%3C/svg%3E")}
.ep-icon--link{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1%22/%3E%3C/svg%3E")}
.ep-icon--search{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%2211%22 cy=%2211%22 r=%226.5%22/%3E%3Cpath d=%22M20 20l-4.4-4.4%22/%3E%3C/svg%3E")}
.ep-icon--file{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M7 3.5h7l5 5V20a.5.5 0 0 1-.5.5h-11.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5zM14 3.5V8.5h5%22/%3E%3C/svg%3E")}
.ep-icon--plus{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 5v14M5 12h14%22/%3E%3C/svg%3E")}
.ep-icon--arrow-left{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M19 12H5M11 6l-6 6 6 6%22/%3E%3C/svg%3E")}
.ep-icon--more{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22%23000%22%3E%3Ccircle cx=%226%22 cy=%2212%22 r=%221.5%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%221.5%22/%3E%3Ccircle cx=%2218%22 cy=%2212%22 r=%221.5%22/%3E%3C/svg%3E")}
.ep-icon--external{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5%22/%3E%3C/svg%3E")}
.ep-icon--edit{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4%22/%3E%3C/svg%3E")}
.ep-icon--download{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 4v11M7 10l5 5 5-5M5 20h14%22/%3E%3C/svg%3E")}
.ep-icon--update{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.7h3.7M12 8v4l2.8 1.8%22/%3E%3C/svg%3E")}
.ep-icon--heart-filled{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22%23000%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z%22/%3E%3C/svg%3E")}
.ep-icon--bookmark-filled{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22 fill=%22%23000%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z%22/%3E%3C/svg%3E")}
/* EFT Portal — Komponenten. Alle Werte kommen aus tokens.css (var(--…)). Präfix: ep- */

.ep-root, .ep-root *{box-sizing:border-box}
.ep-root{font-family:var(--font-sans);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}

/* Fokus: 2px accent-Ring mit 2px Abstand in der Flächenfarbe */
.ep-root :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Button ---------- */
.ep-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:38px;padding:0 var(--space-4);border-radius:var(--radius-pill);border:1px solid transparent;font:500 14px/20px var(--font-sans);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s}
.ep-btn--sm{height:32px;padding:0 var(--space-3);font-size:13px}
.ep-btn--primary{background:var(--ink-strong);color:var(--on-ink)}
.ep-btn--primary:hover{opacity:.86}
.ep-btn--accent{background:var(--accent);color:var(--on-accent)}
.ep-btn--accent:hover{opacity:.88}
.ep-btn--outline{background:transparent;color:var(--ink-strong);border-color:var(--border-control)}
.ep-btn--outline:hover{border-color:var(--ink-strong)}
.ep-btn--text{background:transparent;color:var(--ink-muted);padding:0 var(--space-2)}
.ep-btn--text:hover{color:var(--ink-strong)}
.ep-btn--danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.ep-btn[disabled]{opacity:.4;cursor:not-allowed}

/* Icon-Button (ActionBar, Menü) */
.ep-iconbtn{display:inline-flex;align-items:center;gap:var(--space-1);background:none;border:0;padding:4px;border-radius:var(--radius-pill);color:var(--ink-muted);font:400 13px/20px var(--font-sans);cursor:pointer}
.ep-iconbtn:hover{color:var(--ink-strong)}
.ep-iconbtn[aria-pressed="true"]{color:var(--ink-strong)}

/* ---------- Avatar ---------- */
.ep-avatar{display:inline-grid;place-items:center;flex:none;width:var(--avatar-sm);height:var(--avatar-sm);border-radius:var(--radius-full);background:var(--surface-muted);color:var(--ink-strong);font:600 13px/1 var(--font-sans);overflow:hidden;object-fit:cover}
.ep-avatar--xs{width:var(--avatar-xs);height:var(--avatar-xs);font-size:9px}
.ep-avatar--md{width:var(--avatar-md);height:var(--avatar-md);font-size:16px}
.ep-avatar--lg{width:var(--avatar-lg);height:var(--avatar-lg);font-size:24px}

/* ---------- Tag & Filter-Chip ---------- */
.ep-tags{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.ep-tag{display:inline-flex;align-items:center;height:32px;padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--surface-muted);color:var(--ink);font:400 14px/20px var(--font-sans);text-decoration:none;border:0;cursor:pointer}
.ep-tag:hover{color:var(--ink-strong)}
.ep-tag--sm{height:24px;padding:0 var(--space-2);font-size:13px}
.ep-chip{display:inline-flex;align-items:center;height:32px;padding:0 var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--border-control);background:transparent;color:var(--ink);font:400 14px/20px var(--font-sans);cursor:pointer}
.ep-chip[aria-pressed="true"]{background:var(--ink-strong);border-color:var(--ink-strong);color:var(--on-ink)}
.ep-filter{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)}
.ep-filter__label{font:600 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);min-width:88px}

/* ---------- Badge (Format, Modalität, Herkunft) ---------- */
.ep-badges{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.ep-badge{display:inline-flex;align-items:center;gap:var(--space-1);height:22px;padding:0 var(--space-2);border-radius:var(--radius-sm);border:1px solid var(--border-control);color:var(--ink);font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ep-badge--fill{background:var(--surface-muted);border-color:transparent}
.ep-badge--warning{background:var(--warning-soft);border-color:transparent;color:var(--warning)}
.ep-badge--accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* ---------- Status-Pill (Dashboard) ---------- */
.ep-status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-pill);font:500 13px/20px var(--font-sans);white-space:nowrap}
.ep-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ep-status--online{background:var(--accent-soft);color:var(--accent)}
.ep-status--offline{background:var(--warning-soft);color:var(--warning)}
.ep-status--draft{background:var(--surface-muted);color:var(--ink-muted)}
.ep-status--draft::before{background:transparent;border:1.5px solid currentColor;width:7px;height:7px}

/* ---------- Eingabefelder ---------- */
.ep-field{display:grid;gap:6px}
.ep-field__label{font:500 14px/20px var(--font-sans);color:var(--ink-strong)}
.ep-field__hint{font:400 13px/20px var(--font-sans);color:var(--ink-muted)}
.ep-field__error{font:400 13px/20px var(--font-sans);color:var(--danger)}
.ep-input{width:100%;height:40px;padding:0 var(--space-3);border:1px solid var(--border-control);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:400 15px/20px var(--font-sans)}
.ep-input::placeholder{color:var(--ink-muted)}
.ep-input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ep-input[aria-invalid="true"]{border-color:var(--danger)}
.ep-search{display:flex;align-items:center;gap:var(--space-2);height:40px;padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--surface-muted);color:var(--ink-muted);min-width:0}
.ep-search input{flex:1;min-width:0;border:0;background:transparent;font:400 14px/20px var(--font-sans);color:var(--ink);outline:0}
.ep-search input::placeholder{color:var(--ink-muted)}
.ep-search:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- TopNav ---------- */
.ep-nav{display:flex;align-items:center;gap:var(--space-6);height:var(--header-height);padding:0 var(--space-6);border-bottom:1px solid var(--border);background:var(--surface)}
.ep-wordmark{font:700 22px/1 var(--font-sans);letter-spacing:-.03em;color:var(--ink-strong);text-decoration:none;white-space:nowrap}
.ep-wordmark span{color:var(--accent)}
.ep-nav__links{display:flex;gap:var(--space-6)}
.ep-nav__link{font:400 14px/20px var(--font-sans);color:var(--ink-muted);text-decoration:none}
.ep-nav__link[aria-current="page"]{color:var(--ink-strong);font-weight:500}
.ep-nav .ep-search{flex:1;max-width:320px}
.ep-nav__end{margin-left:auto;display:flex;align-items:center;gap:var(--space-4)}

/* ---------- Tabs (Dashboard) ---------- */
.ep-tabs{display:flex;gap:var(--space-8);border-bottom:1px solid var(--border);overflow-x:auto}
.ep-tab{display:inline-flex;gap:6px;padding:0 0 var(--space-4);border:0;border-bottom:1px solid transparent;margin-bottom:-1px;background:none;font:400 14px/20px var(--font-sans);color:var(--ink-muted);cursor:pointer;white-space:nowrap}
.ep-tab[aria-selected="true"]{color:var(--ink-strong);border-bottom-color:var(--ink-strong)}
.ep-tab__count{color:var(--ink-muted)}

/* ---------- Byline ---------- */
.ep-byline{display:flex;align-items:center;gap:var(--space-3)}
.ep-byline__name{font:500 16px/24px var(--font-sans);color:var(--ink-strong);text-decoration:none}
.ep-byline__meta{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.ep-byline__updated{color:var(--accent);font-weight:500}
.ep-dot::before{content:"·";margin:0 6px}

/* ---------- ActionBar ---------- */
.ep-actionbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-2) var(--space-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ep-actionbar__group{display:flex;align-items:center;gap:var(--space-6)}

/* ---------- ArticleCard (Feed) ---------- */
.ep-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-12);padding:var(--space-6) 0 var(--space-8);border-bottom:1px solid var(--border)}
.ep-card__author{grid-column:1/-1;display:flex;align-items:center;gap:var(--space-2);font:400 13px/20px var(--font-sans);color:var(--ink)}
.ep-card__body{min-width:0;display:grid;gap:var(--space-2);align-content:start}
.ep-card__title{margin:0;font:700 20px/24px var(--font-sans);color:var(--ink-strong);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.ep-card__title a{color:inherit;text-decoration:none}
.ep-card__sub{margin:0;font:400 16px/20px var(--font-sans);color:var(--ink-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-card__thumb{width:var(--thumb-width);aspect-ratio:3/2;max-width:100%;background:var(--surface-muted);border-radius:var(--radius-none);object-fit:cover}
.ep-card__foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-top:var(--space-2)}
.ep-card__meta{display:flex;align-items:center;gap:var(--space-4);font:400 13px/20px var(--font-sans);color:var(--ink-muted);min-width:0;flex-wrap:wrap}
.ep-card__actions{display:flex;gap:var(--space-2)}
@media (max-width:560px){.ep-card{column-gap:var(--space-4)}.ep-card__thumb{width:80px}.ep-card__title{font-size:16px;line-height:20px}.ep-card__sub{display:none}}

/* ---------- Prose (Artikeltext) ---------- */
.ep-prose{max-width:var(--content-width);font-family:var(--font-serif);font-size:20px;line-height:32px;letter-spacing:-.003em;color:var(--ink)}
.ep-prose > * + *{margin-top:var(--space-8)}
.ep-prose p{margin-bottom:0}
.ep-prose > p + p{margin-top:38px}
.ep-prose h2{margin:var(--space-12) 0 0;font:700 24px/30px var(--font-sans);letter-spacing:-.016em;color:var(--ink-strong)}
.ep-prose h2 + p{margin-top:var(--space-2)}
.ep-prose a{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.ep-prose blockquote{margin-left:0;margin-right:0;padding-left:var(--space-6);border-left:3px solid var(--ink-strong);font-style:italic}
.ep-prose .ep-pullquote{margin-left:0;margin-right:0;font-size:26px;line-height:36px;font-style:italic;color:var(--ink-muted);padding-left:var(--space-6);border-left:3px solid var(--ink-strong)}
.ep-prose ul,.ep-prose ol{padding-left:30px}
.ep-prose li + li{margin-top:var(--space-3)}
.ep-prose figure{margin-left:0;margin-right:0}
.ep-prose figcaption{margin-top:var(--space-2);text-align:center;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.ep-prose code{font:400 .8em/1 var(--font-mono);background:var(--surface-muted);padding:2px 4px;border-radius:var(--radius-sm)}
@media (max-width:728px){.ep-prose{font-size:18px;line-height:28px}.ep-prose h2{font-size:20px;line-height:24px}}

/* ---------- Artikelkopf ---------- */
.ep-headline{margin:0;font:700 42px/52px var(--font-sans);letter-spacing:-.011em;color:var(--ink-strong);text-wrap:balance}
.ep-subline{margin:var(--space-2) 0 0;font:400 22px/28px var(--font-sans);color:var(--ink-muted);text-wrap:pretty}
@media (max-width:728px){.ep-headline{font-size:32px;line-height:38px}.ep-subline{font-size:18px;line-height:24px}}

/* ---------- UpdateNote (Aktualisierung) ---------- */
.ep-update{display:grid;gap:var(--space-2);padding:var(--space-4) var(--space-6);border-radius:var(--radius-md);background:var(--accent-soft);color:var(--ink)}
.ep-update__head{display:flex;align-items:center;gap:var(--space-2);font:600 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ep-update__head time{font-weight:500;letter-spacing:0;text-transform:none;font-size:13px;color:var(--ink-muted)}
.ep-update__body{margin:0;font:400 18px/28px var(--font-serif)}
.ep-updates{display:grid;gap:var(--space-3)}

/* ---------- Attachment ---------- */
.ep-files{display:grid;border-top:1px solid var(--border)}
.ep-file{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) 0;border-bottom:1px solid var(--border);color:var(--ink);text-decoration:none}
.ep-file__icon{display:grid;place-items:center;width:40px;height:48px;flex:none;border-radius:var(--radius-sm);background:var(--surface-muted);font:600 10px/1 var(--font-sans);letter-spacing:.06em;color:var(--ink-strong);text-transform:uppercase}
.ep-file__text{min-width:0;flex:1}
.ep-file__name{font:500 15px/20px var(--font-sans);color:var(--ink-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-file__meta{font:400 13px/20px var(--font-sans);color:var(--ink-muted)}

/* ---------- Kommentare ---------- */
.ep-comments{max-width:var(--content-width);display:grid;gap:var(--space-6)}
.ep-composer{display:grid;gap:var(--space-3);padding:var(--space-4);border-radius:var(--radius-sm);background:var(--surface);box-shadow:var(--shadow-popover)}
.ep-composer textarea{width:100%;min-height:72px;resize:vertical;border:0;background:transparent;color:var(--ink);font:400 14px/20px var(--font-sans);outline:0}
.ep-composer textarea::placeholder{color:var(--ink-muted)}
.ep-composer__foot{display:flex;justify-content:flex-end;gap:var(--space-2)}
.ep-comment{display:grid;gap:var(--space-3);padding-bottom:var(--space-6);border-bottom:1px solid var(--border)}
.ep-comment__head{display:flex;align-items:center;gap:var(--space-3)}
.ep-comment__name{font:500 14px/20px var(--font-sans);color:var(--ink-strong)}
.ep-comment__date{font:400 13px/20px var(--font-sans);color:var(--ink-muted)}
.ep-comment__text{margin:0;font:400 14px/20px var(--font-sans);color:var(--ink)}
.ep-comment__actions{display:flex;align-items:center;gap:var(--space-4)}
.ep-replies{display:grid;gap:var(--space-4);margin-left:14px;padding-left:var(--space-6);border-left:3px solid var(--border)}
.ep-replies .ep-comment{border-bottom:0;padding-bottom:0}
.ep-authorbadge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:var(--radius-sm);background:var(--ink-strong);color:var(--on-ink);font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase}

/* ---------- AuthorCard ---------- */
.ep-authorcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2) var(--space-4);align-items:start;padding:var(--space-8) 0;border-top:1px solid var(--border)}
.ep-authorcard .ep-avatar{grid-row:span 3}
.ep-overline{font:600 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.ep-authorcard__name{margin:0;font:700 20px/24px var(--font-sans);color:var(--ink-strong)}
.ep-authorcard__bio{margin:0;font:400 14px/20px var(--font-sans);color:var(--ink);grid-column:2/-1}
@media (max-width:560px){.ep-authorcard{grid-template-columns:auto minmax(0,1fr)}.ep-authorcard .ep-btn{grid-column:1/-1;justify-self:start}}

/* ---------- SourceBox (externe Quelle) ---------- */
.ep-source{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-4);padding:var(--space-4);border:1px solid var(--border-control);border-radius:var(--radius-md)}
.ep-source__head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.ep-source__thumb{width:72px;height:72px;background:var(--surface-muted);border-radius:var(--radius-sm)}
.ep-source__title{margin:0;font:700 16px/20px var(--font-sans);color:var(--ink-strong)}
.ep-source__meta{margin:0;font:400 13px/20px var(--font-sans);color:var(--ink-muted)}
.ep-source__url{font:400 13px/20px var(--font-mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ep-source__link{display:inline-flex;align-items:center;gap:var(--space-1);font:500 14px/20px var(--font-sans);color:var(--accent);text-decoration:none}

/* ---------- Editor ---------- */
.ep-editorbar{display:flex;align-items:center;gap:var(--space-4);height:var(--header-height);padding:0 var(--space-6);border-bottom:1px solid var(--border)}
.ep-editorbar__state{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.ep-editorbar__end{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.ep-editor{max-width:var(--content-width);display:grid;gap:var(--space-4)}
.ep-editor__title,.ep-editor__sub{width:100%;border:0;background:transparent;outline:0;padding:0;resize:none}
.ep-editor__title{font:700 42px/52px var(--font-sans);letter-spacing:-.011em;color:var(--ink-strong)}
.ep-editor__sub{font:400 22px/28px var(--font-sans);color:var(--ink-muted)}
.ep-editor__title::placeholder,.ep-editor__sub::placeholder{color:var(--ink-muted);opacity:.7}
.ep-editor__body{font:400 20px/32px var(--font-serif);color:var(--ink);min-height:96px}
.ep-editor__body:empty::before{content:attr(data-placeholder);color:var(--ink-muted)}
.ep-editor__aside{display:flex;align-items:center;gap:var(--space-2);color:var(--ink-muted);font:400 14px/20px var(--font-sans)}

/* ---------- Dashboard: Artikelliste ---------- */
.ep-table{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-sans)}
.ep-table th{text-align:left;font:600 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);padding:0 var(--space-4) var(--space-3) 0;border-bottom:1px solid var(--border);white-space:nowrap}
.ep-table td{padding:var(--space-4) var(--space-4) var(--space-4) 0;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink)}
.ep-table td.num,.ep-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.ep-row__title{font:700 16px/20px var(--font-sans);color:var(--ink-strong)}
.ep-row__sub{font:400 13px/20px var(--font-sans);color:var(--ink-muted)}
.ep-row__actions{display:flex;justify-content:flex-end;gap:var(--space-1)}
.ep-scroll{overflow-x:auto}

/* ---------- Menü / Popover ---------- */
.ep-menu{display:grid;min-width:200px;padding:var(--space-2) 0;border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-popover);border:1px solid var(--border)}
.ep-menu button{display:block;width:100%;text-align:left;padding:var(--space-2) var(--space-4);border:0;background:none;font:400 14px/20px var(--font-sans);color:var(--ink);cursor:pointer}
.ep-menu button:hover{background:var(--surface-subtle);color:var(--ink-strong)}
.ep-menu hr{border:0;border-top:1px solid var(--border);margin:var(--space-2) 0}
.ep-menu .is-danger{color:var(--danger)}

/* ---------- SignIn ---------- */
.ep-signin{display:grid;justify-items:center;gap:var(--space-4);text-align:center;max-width:420px;margin:0 auto;padding:var(--space-12) var(--space-6)}
.ep-signin__title{margin:0;font:700 32px/40px var(--font-sans);letter-spacing:-.016em;color:var(--ink-strong)}
.ep-signin__text{margin:0;font:400 16px/24px var(--font-serif);color:var(--ink)}
.ep-signin__note{margin:0;font:400 13px/20px var(--font-sans);color:var(--ink-muted)}

@media (prefers-reduced-motion:reduce){.ep-root *{transition:none!important}}


/* Avatar-Pastellfarben */
.av-rose{background:#f6d5dc;color:#6b2e3b}.av-peach{background:#fae0cc;color:#6e3b16}.av-butter{background:#f5e8b8;color:#5e4a0e}.av-mint{background:#d3eedd;color:#1f5135}.av-sky{background:#d2e6f5;color:#1d4766}.av-lavender{background:#e2dbf3;color:#44306e}.av-lilac{background:#f0d9ee;color:#632e5e}.av-sage{background:#dce6d0;color:#3c4f27}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av-rose{background:#4a2a31;color:#f6d5dc}:root:not([data-theme="light"]) .av-peach{background:#4a3020;color:#fae0cc}:root:not([data-theme="light"]) .av-butter{background:#433a1c;color:#f5e8b8}:root:not([data-theme="light"]) .av-mint{background:#203d2c;color:#d3eedd}:root:not([data-theme="light"]) .av-sky{background:#1f3549;color:#d2e6f5}:root:not([data-theme="light"]) .av-lavender{background:#332b4d;color:#e2dbf3}:root:not([data-theme="light"]) .av-lilac{background:#45293f;color:#f0d9ee}:root:not([data-theme="light"]) .av-sage{background:#2f3a25;color:#dce6d0}}
:root[data-theme="dark"] .av-rose{background:#4a2a31;color:#f6d5dc}:root[data-theme="dark"] .av-peach{background:#4a3020;color:#fae0cc}:root[data-theme="dark"] .av-butter{background:#433a1c;color:#f5e8b8}:root[data-theme="dark"] .av-mint{background:#203d2c;color:#d3eedd}:root[data-theme="dark"] .av-sky{background:#1f3549;color:#d2e6f5}:root[data-theme="dark"] .av-lavender{background:#332b4d;color:#e2dbf3}:root[data-theme="dark"] .av-lilac{background:#45293f;color:#f0d9ee}:root[data-theme="dark"] .av-sage{background:#2f3a25;color:#dce6d0}
img.ep-avatar{object-fit:cover}
.pf-set{border:0;margin:0;padding:0;display:grid;gap:14px}
.pf-set legend{margin-bottom:6px}
.pf-opt{display:flex;align-items:center;gap:8px;font:500 14px/20px var(--font-sans);color:var(--ink-strong)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding-left:24px}
.swatch{width:44px;height:44px;border-radius:50%;border:0;font:600 14px/1 var(--font-sans);cursor:pointer;box-shadow:0 0 0 0 transparent}
.swatch[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface-subtle),0 0 0 4px var(--ink-strong)}
.pf-photo{display:flex;gap:16px;align-items:center;padding-left:24px}
.pf-empty{border:1px dashed var(--border-control);background:transparent;color:var(--ink-muted)}

/* Weichere Outlines für Buttons und Chips */
:root{--border-soft:#dedede}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--border-soft:#3a3a3a}}
:root[data-theme="dark"]{--border-soft:#3a3a3a}
.ep-btn--outline,.ep-chip,.gbtn{border-color:var(--border-soft)}
.ep-btn--outline:hover,.ep-chip:hover,.gbtn:hover{border-color:var(--ink-muted)}
.ep-chip[aria-pressed="true"]{border-color:var(--ink-strong)}
.lang[aria-pressed="true"]{box-shadow:0 0 0 1px var(--border-soft)}
/* Ankündigungsleiste */
.announce{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 56px;background:#f5c54b;color:#191919;border-top:1px solid #191919;border-bottom:1px solid #191919;box-sizing:border-box}
.announce__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;text-align:center;font:400 15px/22px var(--font-sans)}
.announce__pill{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:6px;background:#fff;color:#191919;font:500 15px/20px var(--font-sans)}
.announce__link{color:#191919;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.announce__close{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#191919;font:400 24px/1 var(--font-sans);cursor:pointer}
.announce__close:hover{background:rgba(25,25,25,.1)}
.announce :focus-visible{outline:2px solid #191919;outline-offset:2px}
@media (max-width:560px){.announce{justify-content:flex-start;padding:10px 52px 10px 16px}.announce__inner{justify-content:flex-start;text-align:left;font-size:14px}}
/* Marke EFT4UA */
.brand{display:inline-flex;align-items:center;gap:12px}
.brand__logo{height:30px;width:auto;display:block}
.brand__sep{width:1px;height:22px;background:var(--border-soft)}
.ep-wordmark .brand__portal{font:500 17px/1 var(--font-sans);letter-spacing:-.01em;color:var(--ink-strong)}
.brand--lg{flex-direction:column;gap:10px}.brand--lg .brand__logo{height:64px}.brand--lg .brand__sep{display:none}.ep-wordmark .brand--lg .brand__portal{font-size:20px;color:var(--ink-muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand__logo{filter:invert(1)}}
:root[data-theme="dark"] .brand__logo{filter:invert(1)}
@media (max-width:560px){.brand__logo{height:24px}.brand__portal{font-size:15px}.brand{gap:8px}}
/* Bücherregal */
.ep-icon--books{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M4.5 4.5h3v15h-3zM9 6.5h3v13H9zM13.6 6.7l2.9-.8 3.6 13.5-2.9.8zM3 20.5h18%22/%3E%3C/svg%3E")}
.ep-icon--shuffle{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8c1.1 1.6 2.3 2.6 4.3 2.6H21M3 17h3.5c1.4 0 2.4-.5 3.2-1.3M13.3 8.3c.8-.8 1.8-1.3 3.2-1.3H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5%22/%3E%3C/svg%3E")}
.ep-icon--spark{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9-1.9 5.1-1.9-5.1-5.1-1.9 5.1-1.9zM18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z%22/%3E%3C/svg%3E")}
.nav-shelf{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-8px 0 -8px -12px;border-radius:50%}
.nav-shelf:hover{background:var(--surface-muted);color:var(--ink-strong)}
.nav-shelf[aria-current="page"]{color:var(--ink-strong);background:var(--surface-muted)}
.shelf{max-width:1240px}
.shelf-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-8)}
.shelf-actions{display:flex;gap:var(--space-2);flex-wrap:wrap}
.shelf-tools{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4)}
.shelf-search{flex:1 1 260px;max-width:none!important}
.shelf-sel{position:relative;display:inline-flex}
.shelf-sel select.ep-input{-webkit-appearance:none;appearance:none;height:40px;border-radius:var(--radius-pill);padding:0 44px 0 18px;border-color:var(--border-soft);font-size:14px;background-color:var(--surface);cursor:pointer}
.shelf-sel select:hover{border-color:var(--ink-muted)}
.shelf-sel::after{content:"";position:absolute;right:18px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--ink-muted);-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 12%22%3E%3Cpath d=%22M2.5 4.5 6 8l3.5-3.5%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 12%22%3E%3Cpath d=%22M2.5 4.5 6 8l3.5-3.5%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E") center/contain no-repeat;pointer-events:none}
.shelf-cats{display:flex;gap:var(--space-2);overflow-x:auto;padding:4px 2px 16px;margin-bottom:var(--space-6);border-bottom:1px solid var(--border);scrollbar-width:thin}
.shelf-cats .ep-chip{flex:none;gap:6px}
.shelf-cats .ep-chip[aria-pressed="true"] .muted{color:inherit;opacity:.7}
.shelf-count{font:400 14px/20px var(--font-sans);color:var(--ink-muted);margin:0 0 var(--space-6)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:40px 28px}
.shelf-row{margin-bottom:var(--space-12)}
.shelf-row__head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)}
.shelf-row__head h2{margin:0;font:700 22px/28px var(--font-sans);letter-spacing:-.01em;color:var(--ink-strong)}
.shelf-row__head h2 span{font-weight:400;color:var(--ink-muted);font-size:16px}
.shelf-row__track{display:grid;grid-auto-flow:column;grid-auto-columns:176px;gap:28px;overflow-x:auto;padding:8px 4px 16px;margin:-8px -4px 0;scroll-snap-type:x proximity;scrollbar-width:thin}
.shelf-row__track .book{scroll-snap-align:start}
.book{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-content:start;min-width:0}
.book__cover{display:block;text-decoration:none;color:inherit;border-radius:3px 6px 6px 3px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.10);transition:transform .25s ease,box-shadow .25s ease;margin-bottom:10px;outline-offset:4px}
.book__cover:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 32px rgba(0,0,0,.18)}
.cover-art{position:relative;aspect-ratio:2/3;min-height:0;height:auto;width:100%;border-radius:inherit;overflow:hidden;display:flex;flex-direction:column;padding:14px 14px 12px;box-sizing:border-box}
.cover-art::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0));z-index:1}
.cover-art__motif{position:absolute;inset:0;width:100%;height:100%}
.cover-art__author{position:relative;font:600 9px/12px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.cover-art__title{position:relative;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;margin-top:10px;font:700 17px/21px var(--font-serif);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.cover-art__fmt{position:relative;margin-top:auto;align-self:flex-start;font:600 8.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border:1px solid;border-radius:3px;backdrop-filter:blur(2px)}
.book__save{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#191919;cursor:pointer;opacity:0;transition:opacity .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.book:hover .book__save,.book__save:focus-visible,.book__save[aria-pressed="true"]{opacity:1}
.book__title{hyphens:auto;overflow-wrap:break-word;font:500 15px/20px var(--font-sans);color:var(--ink-strong);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book__title:hover{text-decoration:underline}
.book__meta{display:flex;align-items:center;gap:4px;font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
.book__meta .ep-icon{width:14px;height:14px}
@media (hover:none){.book__save{opacity:1}}
@media (max-width:560px){.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}.shelf-row__track{grid-auto-columns:140px;gap:16px}.cover-art__title{font-size:15px;line-height:19px}.shelf-sel{flex:1 1 45%}.shelf-sel select{width:100%}}
@media (prefers-reduced-motion:reduce){.book__cover,.book__cover:hover{transition:none;transform:none}}
/* Titelbild */
.cover--img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:var(--surface-muted)}
img.ep-card__thumb{display:block;object-fit:cover}
.cover-prev{display:grid;grid-template-columns:minmax(0,240px) auto;gap:16px;align-items:center}

.card-tags .ep-tag--sm{font-size:12px;height:24px}
.tagcloud{overflow:hidden;transition:max-height .35s ease}
.tagcloud.is-clamped{max-height:calc(5 * 32px + 4 * var(--space-2))}

.mem-name{font:500 15px/22px var(--font-sans);color:var(--ink-strong);margin:0}

.appls{display:grid}
.appl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:1px solid var(--border)}
.appl__head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.appl__note{margin:8px 0 0;font:400 15px/24px var(--font-serif,Georgia,serif);color:var(--ink)}

.mem-table thead{display:none}
.mem-table,.mem-table tbody{display:block}

.mem-table td{display:block;padding:0;border:0}
.mem-table td:first-child{flex:1 0 100%}
.mem-id{min-width:0}
.mem-table td.num::after{content:" " attr(data-l)}
.mem-table td.num{font-size:13px;color:var(--ink-muted)}
.mem-table .col-joined{display:none}
.mem-table td:last-child{font-size:13px}
.mem-table tr td:nth-child(2){margin-left:60px}

.appl__act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

    A({ id: 'a1', authorId: 'u-lh', format: 'artikel', modality: 'couples', hasCover: true,
      title: { de: 'Rückzug und Verfolgung: den negativen Zyklus im Erstgespräch erkennen', en: 'Withdraw and pursue: spotting the negative cycle in the first session', uk: 'Віддалення й переслідування: як розпізнати негативний цикл на першій зустрічі' },
      sub: { de: 'Woran sich das Muster in den ersten zwanzig Minuten zeigt und wie man es dem Paar zurückspiegelt.', en: 'How the pattern shows itself in the first twenty minutes, and how to reflect it back to the couple.', uk: 'Як патерн проявляється в перші двадцять хвилин і як віддзеркалити його парі.' },
      tags: { de: ['Negativer Zyklus', 'Paartherapie', 'Erstgespräch'], en: ['Negative cycle', 'Couples therapy', 'First session'], uk: ['Негативний цикл', 'Терапія пар', 'Перша зустріч'] },
      body: {
        de: 'Im Erstgespräch zeigt sich der Zyklus selten als Thema, sondern als Ablauf: Eine Person wird lauter, die andere stiller. Wer genau hinsieht, erkennt das Muster oft schon, bevor das Paar sein Anliegen ausgesprochen hat.\n\n## Woran man den Zyklus erkennt\n\nDie verfolgende Person spricht schneller, wiederholt sich und sucht Blickkontakt. Die zurückziehende Person beschreibt Sachverhalte, wird knapper und schaut zur Therapeutin statt zum Partner.\n\n> Der Zyklus ist der gemeinsame Gegner, nicht einer der beiden Menschen.\n\n## Das Muster zurückspiegeln\n\n- Den Ablauf beschreiben, nicht bewerten\n- Beide Positionen als verständlichen Schutz würdigen\n- Nach der Emotion unter der Reaktion fragen\n\nFür die ersten Sitzungen hat sich bewährt, den Zyklus gemeinsam aufzuzeichnen. Das Arbeitsblatt dazu hängt unten an.',
        en: 'In the first session the cycle rarely shows up as a topic. It shows up as a sequence: one partner gets louder, the other quieter. If you look closely, you can often see the pattern before the couple has even said why they came.\n\n## How to recognise the cycle\n\nThe pursuing partner speaks faster, repeats themselves and seeks eye contact. The withdrawing partner describes facts, gets shorter and looks at the therapist instead of their partner.\n\n> The cycle is the shared enemy, not either of the two people.\n\n## Reflecting the pattern back\n\n- Describe the sequence, don’t judge it\n- Acknowledge both positions as understandable protection\n- Ask about the emotion beneath the reaction\n\nIn the first sessions it helps to draw the cycle together. The worksheet for this is attached below.',
        uk: 'На першій зустрічі цикл рідко постає як тема – він постає як послідовність: один партнер говорить голосніше, інший тихішає. Уважний погляд часто помічає патерн ще до того, як пара назвала свій запит.\n\n## Як розпізнати цикл\n\nПартнер, що переслідує, говорить швидше, повторюється й шукає зорового контакту. Партнер, що віддаляється, описує факти, відповідає коротше й дивиться на терапевтку, а не на партнера.\n\n> Цикл – це спільний ворог, а не хтось із двох людей.\n\n## Як віддзеркалити патерн\n\n- Описувати послідовність, а не оцінювати її\n- Визнавати обидві позиції як зрозумілий захист\n- Питати про емоцію під реакцією\n\nНа перших сесіях добре працює спільне малювання циклу. Робочий аркуш додано нижче.' },
      createdAt: daysAgo(40), publishedAt: daysAgo(38), updatedAt: daysAgo(3),
      updates: [

        { id: 'c1', authorId: 'u-as', text: { de: 'Sehr hilfreich für mein Praktikum. Wie gehst du vor, wenn ein Partner den Zyklus komplett abstreitet?', en: 'Very helpful for my placement. What do you do when one partner completely denies the cycle?', uk: 'Дуже корисно для моєї практики. Що ти робиш, коли один із партнерів повністю заперечує цикл?' }, date: daysAgo(2, 9), parentId: null, likes: ['u-jw', 'u-me'] },

    A({ id: 'a3', authorId: 'u-jw', format: 'artikel', modality: 'individual', hasCover: true,
      title: { de: 'Emotionen als Kompass in der Einzeltherapie', en: 'Emotions as a compass in individual therapy', uk: 'Емоції як компас в індивідуальній терапії' },
      sub: { de: 'Warum EFT-Arbeit mit Einzelnen bei der primären Emotion ansetzt und was das für die ersten Sitzungen heißt.', en: 'Why EFT work with individuals starts from the primary emotion, and what that means for the first sessions.', uk: 'Чому ЕФТ з індивідуальними клієнтами починається з первинної емоції і що це означає для перших сесій.' },
      tags: { de: ['Einzeltherapie', 'Emotionsregulation'], en: ['Individual therapy', 'Emotion regulation'], uk: ['Індивідуальна терапія', 'Регуляція емоцій'] },
      body: { de: 'Wer mit Einzelnen emotionsfokussiert arbeitet, fragt weniger nach dem Warum und mehr nach dem Jetzt: Was ist gerade spürbar, wenn Sie davon erzählen?\n\n## Primäre und sekundäre Emotionen\n\nÄrger ist oft die zweite Emotion. Darunter liegt häufig Angst, nicht zu genügen, oder Trauer über Verlorenes. Die therapeutische Arbeit besteht darin, diesen Weg nach unten mitzugehen.\n\n> Die Emotion ist der Weg, nicht das Hindernis.',
        en: 'Working emotion-focused with individuals means asking less about why and more about now: what can you feel right now as you tell me this?\n\n## Primary and secondary emotions\n\nAnger is often the second emotion. Beneath it there is frequently fear of not being enough, or grief over something lost. The therapeutic work is to walk that path downward together.\n\n> The emotion is the way, not the obstacle.',
        uk: 'Емоційно-фокусована робота з однією людиною – це менше «чому» і більше «зараз»: що ви відчуваєте саме тепер, коли про це розповідаєте?\n\n## Первинні та вторинні емоції\n\nГнів часто є другою емоцією. Під ним нерідко ховається страх бути недостатнім або сум за втраченим. Терапевтична робота полягає в тому, щоб разом пройти цей шлях углиб.\n\n> Емоція – це шлях, а не перешкода.' },
      createdAt: daysAgo(25), publishedAt: daysAgo(23), updatedAt: daysAgo(6),

      likes: ['u-lh', 'u-mk', 'u-as', 'u-tb', 'u-me'] }),

      title: { de: 'Sue Johnson über Bindungsverletzungen – Vortrag mit Zusammenfassung', en: 'Sue Johnson on attachment injuries – talk with summary', uk: 'Сью Джонсон про травми прив’язаності – лекція з підсумком' },
      sub: { de: 'Die wichtigsten Gedanken aus dem Vortrag in drei Punkten.', en: 'The key ideas from the talk in three points.', uk: 'Головні думки лекції у трьох пунктах.' },
      tags: { de: ['Bindungsverletzung', 'Vortrag'], en: ['Attachment injury', 'Talk'], uk: ['Травма прив’язаності', 'Лекція'] },
      sourceTitle: 'Attachment Injuries in Couple Relationships', sourceUrl: 'https://example.org/attachment-injuries',
      body: { de: 'Der Vortrag erklärt, warum einzelne Momente des Verlassenwerdens eine Beziehung über Jahre prägen können.\n\n- Bindungsverletzungen sind Momente, in denen ein Partner in großer Not nicht da war\n- Sie zeigen sich als wiederkehrender Bezugspunkt in Konflikten\n- Heilung braucht eine echte, emotional berührte Entschuldigung',
        en: 'The talk explains why single moments of abandonment can shape a relationship for years.\n\n- Attachment injuries are moments when a partner wasn’t there in great need\n- They show up as a recurring reference point in conflicts\n- Healing needs a genuine, emotionally engaged apology',
        uk: 'Лекція пояснює, чому окремі моменти покинутості можуть роками визначати стосунки.\n\n- Травми прив’язаності – це моменти, коли партнера не було поруч у великій потребі\n- Вони постають як повторювана точка відліку в конфліктах\n- Зцілення потребує щирого, емоційно залученого вибачення' },

    A({ id: 'a5', authorId: 'u-tb', format: 'notizen', modality: 'general',

      sub: { de: 'Notizen aus der Gruppensupervision, anonymisiert und mit Fragen zum Weiterdenken.', en: 'Notes from group supervision, anonymised, with questions to think further.', uk: 'Анонімізовані нотатки з групової супервізії з питаннями для роздумів.' },
      tags: { de: ['Supervision', 'Selbsterfahrung'], en: ['Supervision', 'Self-reflection'], uk: ['Супервізія', 'Саморефлексія'] },
      body: { de: 'Thema der Sitzung war, wie leicht wir selbst Teil des Musters werden: Wir verfolgen den zurückziehenden Partner oder ziehen uns vor dem lauten zurück.\n\n## Fragen zum Weiterdenken\n\n- In welcher Rolle fühle ich mich in Paarsitzungen wohler?\n- Woran merke ich, dass ich mitspiele?',
        en: 'The session was about how easily we become part of the pattern ourselves: we pursue the withdrawing partner, or withdraw from the loud one.\n\n## Questions to think further\n\n- Which role feels more comfortable to me in couples sessions?\n- How do I notice that I’m playing along?',
        uk: 'Темою сесії було те, як легко ми самі стаємо частиною патерну: переслідуємо партнера, що віддаляється, або відступаємо перед голосним.\n\n## Питання для роздумів\n\n- У якій ролі мені комфортніше на сесіях з парами?\n- З чого я помічаю, що підіграю?' },

      sub: { de: 'Zwei Fehler, die ich gemacht habe, und was mir die Supervision dazu gezeigt hat.', en: 'Two mistakes I made, and what supervision showed me about them.', uk: 'Дві мої помилки й те, що показала мені про них супервізія.' },
      tags: { de: ['Praktikum', 'Paartherapie'], en: ['Placement', 'Couples therapy'], uk: ['Практика', 'Терапія пар'] },
      body: { de: 'Nach zehn Sitzungen mit drei Paaren halte ich fest, was ich anders machen würde.\n\n## Zu früh erklären\n\nIch habe den Zyklus erklärt, bevor das Paar ihn erlebt hatte. Das klang wie ein Vortrag.\n\n## Zu wenig verlangsamen\n\nDie wichtigsten Momente gingen im Tempo des Paares unter.',
        en: 'After ten sessions with three couples, I’m writing down what I would do differently.\n\n## Explaining too early\n\nI explained the cycle before the couple had experienced it. It sounded like a lecture.\n\n## Not slowing down enough\n\nThe most important moments got lost in the couple’s pace.',
        uk: 'Після десяти сесій з трьома парами записую, що зробила б інакше.\n\n## Пояснювала надто рано\n\nЯ пояснювала цикл ще до того, як пара його пережила. Це звучало як лекція.\n\n## Замало сповільнювалася\n\nНайважливіші моменти губилися в темпі пари.' },

function setCover(file) {

  readEditor();
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var max = 1600, sc = Math.min(1, max / img.width), c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var d = UI.draft, path = ME + '/cover-' + uid() + '.jpg';
    d.coverImg = c.toDataURL('image/jpeg', 0.82); d.hasCover = true; d.coverPath = null; d.coverUploading = true; URL.revokeObjectURL(url); render();
    c.toBlob(function (b) { sb.storage.from('files').upload(path, b, { contentType: 'image/jpeg' }).then(function (r) { d.coverUploading = false; if (r.error) { toast(t('uploadErr', { n: file.name })); d.coverImg = null; d.hasCover = false; render(); } else d.coverPath = path; }); }, 'image/jpeg', 0.82);
  };
  img.onerror = function () { URL.revokeObjectURL(url); toast(t('coverErr')); };
  img.src = url;
}
function addFiles(list) {

    var d = UI.draft, item = { name: f.name, size: f.size, type: f.type, uploading: true }, path = ME + '/' + uid() + '-' + f.name.replace(/[^\w.\-]+/g, '_');
    d.attachments.push(item);
    sb.storage.from('files').upload(path, f, { contentType: f.type || undefined }).then(function (r) {
      if (r.error) { d.attachments.splice(d.attachments.indexOf(item), 1); toast(t('uploadErr', { n: f.name })); }
      else { item.path = path; delete item.uploading; }
      if (--pending === 0) render();

  });
  render();
}

/* ---------- Supabase: laden & speichern ---------- */
function initialsOf(name) { return (name || '').trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('') || '?'; }
function profileToUser(p) {
  var name = p.name || (p.email || '').split('@')[0];
  return { name: name, initials: p.initials || initialsOf(name), role: p.role || '', bio: p.bio || '', avatar: p.avatar && p.avatar.mode ? p.avatar : null, photoUrl: p.photo_url, deleted: p.status === 'removed' };
}

async function fetchAll() {
  var q = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('articles').select('*').order('created_at', { ascending: false }),
    sb.from('comments').select('*').order('created_at'),
    sb.from('likes').select('*'),
    sb.from('comment_likes').select('*'),
    sb.from('bookmarks').select('article_id').eq('user_id', ME),
    sb.from('reports').select('*'),
    sb.from('notifications').select('*')

  var N = emptyState(); N.lang = S.lang; N.dismissed = S.dismissed; N.user = S.user; N.realAdmin = S.realAdmin;
  profiles.forEach(function (p) {
    N.users[p.id] = profileToUser(p);
    if (p.status === 'member') N.accounts[p.id] = { email: p.email, joinedAt: p.joined_at || p.applied_at, lastActive: p.last_active, admin: p.is_admin };
    if (p.status === 'pending' || p.status === 'declined' || (p.status === 'member' && p.decided_at)) {
      N.applicants.push({ id: p.id, name: N.users[p.id].name, initials: N.users[p.id].initials, email: p.email, appliedAt: p.applied_at, note: p.note, reason: p.reason,
        status: p.status === 'member' ? 'approved' : p.status, decidedAt: p.decided_at, decidedBy: p.decided_by, userId: p.id });
    }
    if (p.status === 'removed') N.deletedMembers = (N.deletedMembers || []).concat([{ id: p.id, name: N.users[p.id].name, email: p.email, reason: p.reason, date: p.decided_at, by: p.decided_by }]);
  });
  var byId = {};
  N.articles = rows.map(function (r) {
    var a = Object.assign({ title: '', sub: '', body: '', tags: [], format: 'notizen', modality: 'general', translation: '', sourceUrl: '', sourceTitle: '', updates: [], attachments: [], coverPath: null }, r.data, {
      id: r.id, authorId: r.author_id, status: r.status, createdAt: r.created_at, publishedAt: r.published_at, updatedAt: r.updated_at, likes: [], comments: [], coverImg: null, hasCover: false });
    byId[a.id] = a; return a;
  });

  comments.forEach(function (c) { var a = byId[c.article_id]; if (!a) return; var x = { id: c.id, authorId: c.author_id, text: c.text, date: c.created_at, parentId: c.parent_id, likes: [] }; cById[x.id] = x; a.comments.push(x); });
  likes.forEach(function (l) { if (byId[l.article_id]) byId[l.article_id].likes.push(l.user_id); });
  clikes.forEach(function (l) { if (cById[l.comment_id]) cById[l.comment_id].likes.push(l.user_id); });
  N.bookmarks = q[5].data.map(function (b) { return b.article_id; });
  N.reports = q[6].data.map(function (r) { return { id: r.id, articleId: r.article_id, reporterId: r.reporter_id, reason: r.reason, text: r.text, date: r.created_at, status: r.status, resolvedAt: r.resolved_at, resolution: r.resolution, snapshot: r.snapshot }; });
  N.notifications = q[7].data.map(function (n) { return { id: n.id, to: n.to_admin ? 'admin' : n.to_user, type: n.type, articleId: n.article_id, reportId: n.report_id, applicantId: n.applicant_id, title: n.title, reason: n.reason, date: n.created_at, read: n.read }; });
  var covers = N.articles.filter(function (a) { return a.coverPath; });
  if (covers.length) {
    var su = await sb.storage.from('files').createSignedUrls(covers.map(function (a) { return a.coverPath; }), 43200);
    if (!su.error) su.data.forEach(function (x, i) { if (x.signedUrl) { covers[i].coverImg = x.signedUrl; covers[i].hasCover = true; } });

/* Der ganze Zustand als Tabellenzeilen. Gespeichert wird nur, was sich seit dem letzten Abgleich geändert hat. */
function rowsOf() {
  var o = { profiles: {}, articles: {}, comments: {}, likes: {}, comment_likes: {}, bookmarks: {}, reports: {}, notifications: {} };
  Object.keys(S.users).forEach(function (id) {
    var u = S.users[id], ac = S.accounts[id], ap = S.applicants.filter(function (x) { return x.id === id; })[0];
    var gone = (S.deletedMembers || []).filter(function (x) { return x.id === id; }).pop();
    var status = u.deleted ? 'removed' : ap && ap.status === 'pending' ? 'pending' : ap && ap.status === 'declined' ? 'declined' : ac ? 'member' : 'pending';
    o.profiles[id] = { id: id, name: u.name, initials: u.initials, role: typeof u.role === 'string' ? u.role : '', bio: typeof u.bio === 'string' ? u.bio : '', avatar: u.avatar || { mode: 'color' },
      status: status, is_admin: id === ME ? !!S.realAdmin : !!(ac && ac.admin),
      reason: gone ? gone.reason : (ap && ap.reason) || '', decided_at: gone ? gone.date : (ap && ap.decidedAt) || null, decided_by: gone ? gone.by : (ap && ap.decidedBy) || null };
  });
  S.articles.forEach(function (a) {
    o.articles[a.id] = { id: a.id, author_id: a.authorId, status: a.status, created_at: a.createdAt, published_at: a.publishedAt || null, updated_at: a.updatedAt,
      data: { title: a.title, sub: a.sub, body: a.body, tags: a.tags, format: a.format, modality: a.modality, translation: a.translation || '', sourceUrl: a.sourceUrl || '', sourceTitle: a.sourceTitle || '',
        updates: a.updates || [], moderation: a.moderation || null, coverPath: a.coverImg ? a.coverPath || null : null,
        attachments: (a.attachments || []).filter(function (f) { return f.path; }).map(function (f) { return { name: f.name, size: f.size, type: f.type, path: f.path }; }) } };
    a.likes.forEach(function (u) { o.likes[a.id + '|' + u] = { article_id: a.id, user_id: u }; });
    a.comments.forEach(function (c) {
      o.comments[c.id] = { id: c.id, article_id: a.id, author_id: c.authorId, parent_id: c.parentId || null, text: L(c.text), created_at: c.date };
      c.likes.forEach(function (u) { o.comment_likes[c.id + '|' + u] = { comment_id: c.id, user_id: u }; });
    });
  });
  S.bookmarks.forEach(function (id) { o.bookmarks[ME + '|' + id] = { user_id: ME, article_id: id }; });
  S.reports.forEach(function (r) { o.reports[r.id] = { id: r.id, article_id: r.articleId, reporter_id: r.reporterId, reason: r.reason, text: L(r.text), created_at: r.date, status: r.status, resolved_at: r.resolvedAt || null, resolution: r.resolution || '', snapshot: r.snapshot || null }; });
  S.notifications.forEach(function (n) { o.notifications[n.id] = { id: n.id, to_user: n.to === 'admin' ? null : n.to, to_admin: n.to === 'admin', type: n.type, article_id: n.articleId || null, report_id: n.reportId || null, applicant_id: n.applicantId || null, title: n.title || null, reason: n.reason || null, created_at: n.date, read: !!n.read }; });
  return o;
}

var synced = null, syncing = null, syncAgain = false;
var TABLES = ['profiles', 'articles', 'comments', 'likes', 'comment_likes', 'bookmarks', 'reports', 'notifications'];
var LINKS = { likes: ['article_id', 'user_id'], comment_likes: ['comment_id', 'user_id'], bookmarks: ['user_id', 'article_id'] };
function sync() {
  if (syncing) { syncAgain = true; return; }
  syncing = pushChanges().catch(function (e) {
    console.error(e); toast(t('syncErr'));
    return fetchAll().then(render, function () {});
  }).then(function () { syncing = null; if (syncAgain) { syncAgain = false; sync(); } });
}
async function pushChanges() {
  var next = rowsOf(), prev = synced, ok = function (r) { if (r.error) throw r.error; };
  var gone = function (tb) { return Object.keys(prev[tb]).filter(function (k) { return !next[tb][k]; }); };
  /* Löschen zuerst: Beiträge nehmen Kommentare und Likes per Cascade mit */
  var del = gone('articles'); if (del.length) ok(await sb.from('articles').delete().in('id', del));
  del = gone('comments'); if (del.length) ok(await sb.from('comments').delete().in('id', del));
  for (var tb in LINKS) for (var k of gone(tb)) { var m = {}; LINKS[tb].forEach(function (c) { m[c] = prev[tb][k][c]; }); ok(await sb.from(tb).delete().match(m)); }
  for (var i = 0; i < TABLES.length; i++) {
    var name = TABLES[i], add = [], changed = [];
    Object.keys(next[name]).forEach(function (key) {
      if (!prev[name][key]) add.push(next[name][key]);
      else if (JSON.stringify(prev[name][key]) !== JSON.stringify(next[name][key])) changed.push(next[name][key]);
    });
    if (name === 'comments') add.sort(function (x, y) { return x.created_at.localeCompare(y.created_at); });
    if (add.length && name !== 'profiles') ok(await sb.from(name).insert(add));
    for (var row of changed) ok(await sb.from(name).update(row).eq('id', row.id));
  }

}
